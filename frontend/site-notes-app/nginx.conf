server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # index.html aponta para os bundles da versao atual: sempre revalidar.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # JS e CSS com hash no nome (main-T3IHBLOE.js): o conteudo de um nome nunca muda.
    # add_header aqui anula os do server, por isso os cabecalhos de seguranca se repetem.
    location ~* "-[a-z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Icones e demais arquivos de public/ mantem o nome entre versoes.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webmanifest|woff|woff2)$ {
        expires 1h;
        try_files $uri =404;
    }
}
