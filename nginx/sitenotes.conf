# Exemplo de site no nginx do host: so o frontend e publicado.
# API e Postgres ficam na rede Docker; o nginx do container frontend faz proxy de /api/.
#
# 1) Copie para sites-available e habilite (Debian/Ubuntu):
#    sudo cp nginx/sitenotes.conf /etc/nginx/sites-available/sitenotes
#    sudo ln -sf /etc/nginx/sites-available/sitenotes /etc/nginx/sites-enabled/sitenotes
#    sudo nginx -t && sudo systemctl reload nginx
#
# 2) No cliente da rede, resolva o nome para o IP desta maquina (ex.: 10.0.0.50):
#    - /etc/hosts (ou hosts do Windows): 10.0.0.50 sitenotes
#    - ou DNS local do roteador
#
# 3) Suba o Compose antes (porta padrao do frontend no host: 4200).
#    Ajuste proxy_pass se FRONTEND_HOST_PORT for outro valor.

server {
    listen 80;
    # Hostname ou IP pelo qual a maquina e acessada na rede (ex.: sitenotes, 10.0.0.50).
    server_name sitenotes;

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
