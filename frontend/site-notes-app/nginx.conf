server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ^~ impede que as locations regex (js/css, imagens) capturem rotas da API.
    # Resolver do Docker + variavel: o nome "api" e resolvido por requisicao, entao o
    # nginx sobe mesmo com a API fora do ar (o app mostra um aviso nesse caso).
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html aponta para os bundles da versao atual: sempre revalidar.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # JS e CSS com hash no nome (main-T3IHBLOE.js): o conteudo de um nome nunca muda.
    # add_header aqui anula os do server, por isso os cabecalhos de seguranca se repetem.
    location ~* "-[a-z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Icones e demais arquivos de public/ mantem o nome entre versoes.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webmanifest|woff|woff2)$ {
        expires 1h;
        try_files $uri =404;
    }
}
