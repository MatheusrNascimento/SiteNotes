# SiteNotes — site para o NGINX do WSL (nao vai no Docker).
#
# O frontend continua no container (porta publicada 4200). Este arquivo so
# faz reverse proxy do NGINX do host para esse container.
#
# No WSL:
#   sudo cp nginx/sitenotes.conf /etc/nginx/sites-available/sitenotes
#   sudo ln -sf /etc/nginx/sites-available/sitenotes /etc/nginx/sites-enabled/sitenotes
#   sudo rm -f /etc/nginx/sites-enabled/default   # se a porta 80 ja estiver em uso
#   sudo nginx -t && sudo systemctl reload nginx
#
# Se usar um hostname proprio, acrescente em /etc/hosts:
#   127.0.0.1  sitenotes.local
# e ajuste server_name abaixo. Tambem inclua essa origem no CORS
# (NGINX_ORIGIN no .env).

upstream sitenotes_frontend {
    server 127.0.0.1:4200;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name sitenotes.local localhost;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://sitenotes_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
