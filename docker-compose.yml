name: sitenotes

services:
  postgres:
    image: postgres:17.11
    container_name: sitenotes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sitenotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitenotes_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sitenotes}
    ports:
      # Exposto só para ferramentas locais (psql, DBeaver). Remova se não precisar.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sitenotes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: SiteNotes.Api/Dockerfile
    image: sitenotes-api:local
    container_name: sitenotes-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # A imagem usa Production por padrão. O Compose é o ambiente local e roda em
      # Development de propósito: só nele as migrations rodam no startup e o OpenAPI é exposto.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-sitenotes};Username=${POSTGRES_USER:-sitenotes};Password=${POSTGRES_PASSWORD:-sitenotes_local_dev}
      Database__ApplyMigrationsOnStartup: "true"
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:4200}
    ports:
      - "${API_HOST_PORT:-5210}:8080"
    networks:
      - sitenotes

  frontend:
    build:
      context: ./frontend/site-notes-app
      dockerfile: Dockerfile
      additional_contexts:
        shared: ./shared
      args:
        API_BASE_URL: http://localhost:${API_HOST_PORT:-5210}/api
    image: sitenotes-frontend:local
    container_name: sitenotes-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:80"
    networks:
      - sitenotes

networks:
  sitenotes:
    driver: bridge

volumes:
  postgres_data:
    name: sitenotes-postgres-data
